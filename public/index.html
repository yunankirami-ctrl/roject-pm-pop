<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Laporan PM POP - Bandung Selatan</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
    .container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #128C7E; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
    
    /* Progress Bar Step */
    .step-indicator { display: flex; justify-content: space-between; margin-bottom: 25px; position: relative; }
    .step-indicator::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: #e0e0e0; z-index: 1; transform: translateY(-50%); }
    .step-bubble { width: 35px; height: 35px; border-radius: 50%; background: #e0e0e0; color: #666; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; z-index: 2; font-size: 14px; }
    .step-bubble.active { background: #25D366; color: white; }
    .step-bubble.completed { background: #128C7E; color: white; }

    /* Form Steps */
    .form-step { display: none; }
    .form-step.active { display: block; }

    .section-title { font-weight: bold; border-bottom: 2px solid #25D366; padding-bottom: 5px; margin-bottom: 15px; color: #128C7E; font-size: 16px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; display: block; margin-bottom: 5px; font-size: 13px; color: #333; }
    input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { border-color: #25D366; outline: none; }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }

    /* Preview Foto */
    .image-preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; border-radius: 6px; border: 1px dashed #ccc; display: none; }

    /* Buttons Navigation */
    .btn-group { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
    button { padding: 12px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-prev { background-color: #6c757d; color: white; }
    .btn-next { background-color: #128C7E; color: white; margin-left: auto; }
    .btn-submit { background-color: #25D366; color: white; width: 100%; }
    button:hover { opacity: 0.9; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }

    .status-box { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; text-align: center; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Laporan PM POP</h2>
  <p class="subtitle">GI BANDUNG SELATAN 150KV</p>

  <!-- Progress Bar Steps -->
  <div class="step-indicator">
    <div class="step-bubble active" id="bubble-1">1</div>
    <div class="step-bubble" id="bubble-2">2</div>
    <div class="step-bubble" id="bubble-3">3</div>
    <div class="step-bubble" id="bubble-4">4</div>
  </div>

  <form id="pmForm">

    <!-- PAGE 1: COVER / GENERAL -->
    <div class="form-step active" id="step-1">
      <div class="section-title">1. COVER / DATA GENERAL</div>
      <div class="row">
        <div class="col form-group">
          <label for="idMr">ID MR *</label>
          <input type="text" id="idMr" placeholder="MR-2026-001" required>
        </div>
        <div class="col form-group">
          <label for="tanggal">Tanggal PM *</label>
          <input type="date" id="tanggal" required>
        </div>
      </div>

      <div class="form-group">
        <label for="namaPop">Nama POP *</label>
        <input type="text" id="namaPop" value="GI BANDUNG SELATAN 150KV" required>
      </div>

      <div class="form-group">
        <label for="alamatPop">Alamat POP</label>
        <input type="text" id="alamatPop" placeholder="Jl. Raya Bandung Selatan">
      </div>

      <div class="btn-group">
        <button type="button" class="btn-next" onclick="nextStep(1)">Lanjut: KWH & PLN &rarr;</button>
      </div>
    </div>

    <!-- PAGE 2: KWH & PLN -->
    <div class="form-step" id="step-2">
      <div class="section-title">2. KWH & PLN</div>
      <div class="row">
        <div class="col form-group">
          <label for="plnKapasitas">Kapasitas PLN</label>
          <input type="text" id="plnKapasitas" value="33 KVA">
        </div>
        <div class="col form-group">
          <label for="kwhMcbR">MCB Phase R (Ampere)</label>
          <input type="text" id="kwhMcbR" placeholder="50">
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="prevStep(2)">&larr; Kembali</button>
        <button type="button" class="btn-next" onclick="nextStep(2)">Lanjut: Rectifier & Battery &rarr;</button>
      </div>
    </div>

    <!-- PAGE 3: RECTIFIER & BATTERY -->
    <div class="form-step" id="step-3">
      <div class="section-title">3. RECTIFIER & BATTERY</div>
      <div class="row">
        <div class="col form-group">
          <label for="rectMerk">Merk Rectifier</label>
          <input type="text" id="rectMerk" placeholder="Emerson / Vertiv">
        </div>
        <div class="col form-group">
          <label for="rectTipe">Tipe Rectifier</label>
          <input type="text" id="rectTipe" placeholder="NetSure 701">
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="bateraiMerk">Merk Baterai</label>
          <input type="text" id="bateraiMerk" placeholder="Enersys">
        </div>
        <div class="col form-group">
          <label for="bateraiKapasitas">Kapasitas Baterai (AH)</label>
          <input type="text" id="bateraiKapasitas" placeholder="100">
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="prevStep(3)">&larr; Kembali</button>
        <button type="button" class="btn-next" onclick="nextStep(3)">Lanjut: Environment & Foto &rarr;</button>
      </div>
    </div>

    <!-- PAGE 4: ENVIRONMENT & FOTO DOCUMENTATION -->
    <div class="form-step" id="step-4">
      <div class="section-title">4. ENVIRONMENT & DOKUMENTASI FOTO</div>
      <div class="row">
        <div class="col form-group">
          <label for="suhuRuangan">Suhu Ruangan (°C)</label>
          <input type="text" id="suhuRuangan" placeholder="22 °C">
        </div>
        <div class="col form-group">
          <label for="kondisiGedung">Kondisi Gedung</label>
          <select id="kondisiGedung">
            <option value="OK">OK</option>
            <option value="NOK">NOK</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="fotoDokumentasi">Upload Foto Pekerjaan / Lokasi POP</label>
        <input type="file" id="fotoDokumentasi" accept="image/*" onchange="previewImage(event)">
        <img id="imgPreview" class="image-preview" alt="Preview Foto">
      </div>

      <div class="form-group">
        <label for="targetWa">Nomor WA Tujuan Notifikasi (Format 62...)</label>
        <input type="text" id="targetWa" placeholder="628123456789">
      </div>

      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="prevStep(4)">&larr; Kembali</button>
        <button type="submit" id="submitBtn" class="btn-submit">Submit Data & Kirim WA Notifikasi</button>
      </div>
    </div>

  </form>

  <div id="statusBox" class="status-box"></div>
</div>

<script>
  let currentStep = 1;
  let base64Photo = '';

  function showStep(step) {
    document.querySelectorAll('.form-step').forEach((el) => el.classList.remove('active'));
    document.getElementById(`step-${step}`).classList.add('active');

    for (let i = 1; i <= 4; i++) {
      const bubble = document.getElementById(`bubble-${i}`);
      if (i < step) {
        bubble.className = 'step-bubble completed';
      } else if (i === step) {
        bubble.className = 'step-bubble active';
      } else {
        bubble.className = 'step-bubble';
      }
    }
  }

  function nextStep(step) {
    if (step === 1) {
      if (!document.getElementById('idMr').value || !document.getElementById('tanggal').value || !document.getElementById('namaPop').value) {
        alert('Mohon isi field wajib (ID MR, Tanggal, dan Nama POP).');
        return;
      }
    }
    currentStep = step + 1;
    showStep(currentStep);
  }

  function prevStep(step) {
    currentStep = step - 1;
    showStep(currentStep);
  }

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Photo = e.target.result;
        const imgElement = document.getElementById('imgPreview');
        imgElement.src = base64Photo;
        imgElement.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }

  document.getElementById('pmForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    btn.disabled = true;
    btn.innerText = 'Memproses & Mengirim WA...';
    statusBox.style.display = 'none';

    const formData = {
      idMr: document.getElementById('idMr').value,
      tanggal: document.getElementById('tanggal').value,
      namaPop: document.getElementById('namaPop').value,
      alamatPop: document.getElementById('alamatPop').value,
      targetWa: document.getElementById('targetWa').value.replace(/[^0-9]/g, ''),
      tipePop: 'Super Backbone',
      plnKapasitas: document.getElementById('plnKapasitas').value,
      kwhMcbR: document.getElementById('kwhMcbR').value,
      rectifierData: [{
        merk: document.getElementById('rectMerk').value,
        tipe: document.getElementById('rectTipe').value
      }],
      bateraiMerk: document.getElementById('bateraiMerk').value,
      bateraiKapasitas: document.getElementById('bateraiKapasitas').value,
      suhuRuangan: document.getElementById('suhuRuangan').value,
      kondisiGedung: document.getElementById('kondisiGedung').value,
      fotoBase64: base64Photo
    };

    try {
      const response = await fetch('/api/submit-pm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      });

      const resData = await response.json();

      if (!response.ok) {
        throw new Error(resData.message || 'Gagal memproses Laporan PM');
      }

      statusBox.style.display = 'block';
      statusBox.style.backgroundColor = '#d4edda';
      statusBox.style.color = '#155724';
      statusBox.innerText = '✅ ' + resData.message;

    } catch (error) {
      statusBox.style.display = 'block';
      statusBox.style.backgroundColor = '#f8d7da';
      statusBox.style.color = '#721c24';
      statusBox.innerText = '❌ Error: ' + error.message;
    } finally {
      btn.disabled = false;
      btn.innerText = 'Submit Data & Kirim WA Notifikasi';
    }
  });
</script>

</body>
</html>
